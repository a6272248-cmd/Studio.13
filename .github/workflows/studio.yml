name: Smart Photo Studio - Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'Smart-Photo-Studio-PRO-V3-PWA.zip'
      - '.github/workflows/studio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Unpack and validate website
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile

          archive = Path('Smart-Photo-Studio-PRO-V3-PWA.zip')
          if not archive.is_file():
              raise SystemExit(f'ERROR: Missing {archive.name} in repository root')

          target = Path('site')
          target.mkdir(parents=True, exist_ok=True)
          try:
              with ZipFile(archive) as z:
                  if z.testzip() is not None:
                      raise SystemExit('ERROR: ZIP integrity check failed')
                  for item in z.infolist():
                      relative = Path(item.filename)
                      if relative.is_absolute() or '..' in relative.parts:
                          raise SystemExit('ERROR: Unsafe path in ZIP')
                      if item.is_dir():
                          continue
                      dest = target / relative
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(z.read(item))
          except BadZipFile:
              raise SystemExit('ERROR: ZIP archive is invalid')

          for filename in ('index.html', 'manifest.webmanifest', 'sw.js', 'icon.svg'):
              file = target / filename
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f'ERROR: Missing or empty {filename}')
          (target / '.nojekyll').touch()
          print('Studio.13 website is ready for publishing')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
