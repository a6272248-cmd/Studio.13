name: Studio.13 - Automatic Deploy

on:
  push:
    branches: [main]
    paths:
      - 'studio.zip'
      - '.github/workflows/studio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate and extract studio.zip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          archive = Path('studio.zip')
          if not archive.is_file():
              raise SystemExit('Missing studio.zip in repository root')
          dest = Path('site')
          dest.mkdir(exist_ok=True)
          try:
              with ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad is not None:
                      raise SystemExit(f'Damaged ZIP entry: {bad}')
                  for member in z.infolist():
                      p = Path(member.filename)
                      if p.is_absolute() or '..' in p.parts:
                          raise SystemExit(f'Unsafe ZIP entry: {member.filename}')
                      if member.is_dir():
                          continue
                      out = dest / p
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_bytes(z.read(member))
          except BadZipFile:
              raise SystemExit('Invalid ZIP')
          for filename in ('index.html', 'manifest.webmanifest', 'sw.js', 'icon.svg'):
              if not (dest / filename).is_file():
                  raise SystemExit(f'Missing required file: {filename}')
          (dest / '.nojekyll').touch()
          print('Studio.13 files ready')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
